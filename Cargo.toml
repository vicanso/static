[package]
name = "static-serve"
version = "0.4.1"
edition = "2024"

[lints.clippy]
# Set the unwrap_used lint level to deny
unwrap_used = "deny"

[features]
# All cloud/network backends are on by default so `cargo build --release`
# preserves the historical "all backends compiled in" behavior. Build with
# `--no-default-features` (optionally re-enabling individual backends, e.g.
# `--features s3`) to strip out MongoDB/AWS SDK/FTP for a much smaller binary
# when only local-filesystem serving is needed. The fs backend is always on.
default = ["s3", "ftp", "gridfs"]
s3 = ["opendal/services-s3"]
ftp = ["opendal/services-ftp"]
gridfs = ["opendal/services-gridfs"]

[dependencies]
TinyUFO = "0.9.0"
aho-corasick = "1.1.5"
# Already in the tree via tower-http's compression features — used directly by
# serve.rs to produce cached compressed bodies with the exact same encoders and
# level mapping the CompressionLayer applies per request.
async-compression = { version = "0.4", features = [
    "tokio",
    "brotli",
    "gzip",
    "zstd",
] }
axum = "0.8.9"
bytes = "1.12.1"
bytesize = "2.7.0"
envy = "0.4.2"
# Already in the tree via axum/hyper; used directly for `StreamExt::next` over
# opendal's `Lister` stream (autoindex).
futures-util = { version = "0.3.34", default-features = false }
base64 = "0.23.1"
http-body = "1.1.0"
httpdate = "1.0"
ipnet = "2.12.2"
humantime = "2.4.0"
mime_guess = "2.0.5"
mimalloc = "0.1.52"
num_cpus = "1.17.0"
opendal = { version = "0.59.3", features = [
    "services-fs",
    "layers-mime-guess",
    "layers-retry",
    "layers-timeout",
] }
path-absolutize = "4.0.1"
serde = { version = "1.0.229", features = ["derive"] }
snafu = "0.9.2"
time = "0.3.55"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "signal"] }
tower = { version = "0.5.3", features = ["timeout"] }
tower-http = { version = "0.7.1", features = [
    "compression-br",
    "compression-gzip",
    "compression-zstd",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["local-time", "json"] }
url = "2.5.8"
urlencoding = "2.1.3"

[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"
